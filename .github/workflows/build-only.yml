name: build-only

on:
  push:
    branches-ignore: ['main']

env:
  FREERADIUS_REPOSITORY: https://github.com/FreeRADIUS/freeradius-server.git
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io
  VERSION: 3.2.10

jobs:
  build-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set FREERADIUS_RELEASE environment variable
        run: echo "FREERADIUS_RELEASE=release_${VERSION//./_}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: |
            FREERADIUS_REPOSITORY=${{ env.FREERADIUS_REPOSITORY }}
            FREERADIUS_RELEASE=${{ env.FREERADIUS_RELEASE }}
          platforms: linux/amd64,linux/arm64
          push: false
